name: Deploy to Google Cloud VM

on:
  workflow_run:
    workflows: ["CI and Container Publishing"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git commit SHA to deploy (must be an exact 40-character lowercase hex SHA)"
        required: true

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    name: Deploy Release to Production VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requirement 2 & 15: Validate trigger preconditions inside step so failures are reported (not silently skipped)
      - name: Validate Workflow Trigger and Upstream Status
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "Evaluating trigger preconditions..."
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${HEAD_REPO}" != "${EXPECTED_REPO}" ]; then
              echo "::error::Triggering repository '${HEAD_REPO}' does not match expected repository '${EXPECTED_REPO}'."
              exit 1
            fi
            if [ "${HEAD_BRANCH}" != "main" ]; then
              echo "::error::Triggering branch '${HEAD_BRANCH}' is not 'main'."
              exit 1
            fi
            if [ "${CONCLUSION}" != "success" ]; then
              echo "::error::Upstream workflow 'CI and Container Publishing' finished with status '${CONCLUSION}' (expected 'success')."
              exit 1
            fi
            echo "Preconditions verified: Upstream CI succeeded on main branch of ${EXPECTED_REPO}."
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Preconditions verified: Manual execution via workflow_dispatch."
          else
            echo "::error::Unsupported trigger event '${EVENT_NAME}'."
            exit 1
          fi

      # Requirement 6: Fail explicitly if required GitHub Actions variables are missing
      - name: Validate Required Google Cloud Variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          MISSING=0
          check_var() {
            if [ -z "$2" ]; then
              echo "::error::Missing required repository variable: $1"
              MISSING=1
            fi
          }
          check_var "GCP_PROJECT_ID" "${GCP_PROJECT_ID}"
          check_var "GCP_ZONE" "${GCP_ZONE}"
          check_var "GCP_VM_NAME" "${GCP_VM_NAME}"
          check_var "GCP_WORKLOAD_IDENTITY_PROVIDER" "${GCP_WIF_PROVIDER}"
          check_var "GCP_DEPLOY_SERVICE_ACCOUNT" "${GCP_DEPLOY_SA}"

          if [ "${MISSING}" -ne 0 ]; then
            echo "::error::Deployment halted: One or more required variables are missing under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required Google Cloud variables are present."

      # Requirement 3 & 4: Pass release_tag via environment variable and validate exact SHA format
      - name: Determine and Validate Immutable Release Identifier
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ -n "${RUN_SHA}" ]; then
            TAG="${RUN_SHA}"
          else
            TAG="${DEFAULT_SHA}"
          fi

          # Normalize to lowercase and remove any whitespace
          TAG="$(echo "${TAG}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          # Strictly validate exact 40-character lowercase hex SHA format matching publishing workflow (type=sha,format=long)
          if [[ ! "${TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release identifier '${TAG}' is invalid. It must be an exact 40-character lowercase hexadecimal Git commit SHA."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Immutable Release SHA: ${TAG}"

      # Requirement 11 & 12: Authenticate to GHCR and verify image existence before deployment
      - name: Log in to GitHub Container Registry on Runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for container registry inspection
        id: repo-owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Verify Both Frontend and Backend Images Exist in GHCR
        env:
          TARGET_TAG: ${{ steps.release.outputs.tag }}
          OWNER: ${{ steps.repo-owner.outputs.OWNER }}
        run: |
          echo "--> Inspecting frontend image: ghcr.io/${OWNER}/lostandfound-frontend:${TARGET_TAG}"
          if ! docker manifest inspect "ghcr.io/${OWNER}/lostandfound-frontend:${TARGET_TAG}" > /dev/null; then
            echo "::error::Frontend image 'ghcr.io/${OWNER}/lostandfound-frontend:${TARGET_TAG}' was not found in GHCR."
            exit 1
          fi

          echo "--> Inspecting backend image: ghcr.io/${OWNER}/lostandfound-backend:${TARGET_TAG}"
          if ! docker manifest inspect "ghcr.io/${OWNER}/lostandfound-backend:${TARGET_TAG}" > /dev/null; then
            echo "::error::Backend image 'ghcr.io/${OWNER}/lostandfound-backend:${TARGET_TAG}' was not found in GHCR."
            exit 1
          fi
          echo "Verified: Both container images are confirmed published in GHCR."

      # Requirement 5: Workload Identity Federation is the only supported deployment authentication method
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Requirement 7: Configure temporary SSH key compatible with Google Cloud OS Login
      - name: Configure Ephemeral SSH Key for Google Cloud OS Login
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          # Generate ephemeral Ed25519 key pair with no passphrase
          ssh-keygen -t ed25519 -f "$HOME/.ssh/google_compute_engine" -N "" -C "github-actions-deployer"
          chmod 600 "$HOME/.ssh/google_compute_engine"
          chmod 644 "$HOME/.ssh/google_compute_engine.pub"

          # Add public key to OS Login profile with a 1-hour time-to-live
          echo "Registering ephemeral SSH key with Google Cloud OS Login (1h TTL)..."
          gcloud compute os-login ssh-keys add \
            --key-file="$HOME/.ssh/google_compute_engine.pub" \
            --ttl=1h

      # Requirement 8, 9, 12, 14: Use IAP TCP forwarding, preserve host key verification, pass GHCR credentials securely, and fail nonzero
      - name: Execute Deployment via Google Cloud IAP Tunnel with Host Verification
        env:
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Connecting to Debian VM '${GCP_VM_NAME}' in zone '${GCP_ZONE}' via IAP tunnel..."
          # Pipe GHCR read token securely into stdin of remote docker login, then execute deploy.sh
          # Preserves SSH host key checking (no StrictHostKeyChecking=no)
          echo "${GHCR_TOKEN}" | gcloud compute ssh "${GCP_VM_NAME}" \
            --zone="${GCP_ZONE}" \
            --project="${GCP_PROJECT_ID}" \
            --tunnel-through-iap \
            --ssh-key-file="$HOME/.ssh/google_compute_engine" \
            --command="docker login ghcr.io -u '${GHCR_USER}' --password-stdin && cd /opt/lostandfound && ./scripts/deploy.sh ${RELEASE_TAG}"
