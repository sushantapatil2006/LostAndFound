name: CI and Container Publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. FRONTEND CI
  # ============================================================================
  frontend-ci:
    name: Frontend Quality & Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/auth.js

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine nginx -t

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image (dry-run test)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: lostandfound-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. BACKEND CI
  # ============================================================================
  backend-ci:
    name: Backend Tests, Security & Container Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lost_found_portal
          MYSQL_USER: lostfound
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev \
            pkg-config \
            gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run code quality and linting checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treat all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run backend unit tests with SQLite
        run: |
          pytest -v --cov=. --cov-report=term-missing

      - name: Run MySQL integration tests against service container
        run: |
          DATABASE_URL="mysql+mysqldb://lostfound:testpassword@127.0.0.1:3306/lost_found_portal" \
          pytest -v tests/test_health.py tests/test_items.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: lostandfound-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Backend Container Starts and Passes Health Check
        run: |
          docker run -d --name test-api \
            -e SECRET_KEY="test-key-for-healthcheck-only" \
            -e ENV="testing" \
            -e AUTO_CREATE_TABLES="true" \
            -e STORAGE_BACKEND="local" \
            -p 5000:5000 \
            lostandfound-backend:test

          # Wait for container startup and verify /api/health
          sleep 6
          curl -f http://localhost:5000/api/health || (docker logs test-api && exit 1)
          docker stop test-api
          docker rm test-api

  # ============================================================================
  # 3. CONTAINER IMAGE PUBLISHING (Pushes to main only)
  # ============================================================================
  publish-images:
    name: Build & Publish Images to GHCR
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for image tagging
        id: repo-owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # Frontend Image Publish
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.OWNER }}/lostandfound-frontend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Image Publish
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.OWNER }}/lostandfound-backend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
