name: Test Google Cloud Connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-connection:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify Google Cloud variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER is missing"
            exit 1
          fi

          if [ -z "$DEPLOY_SA" ]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT is missing"
            exit 1
          fi

          echo "Both Google Cloud authentication variables are available."
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate temporary SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keygen -t ed25519 -N "" \
            -f ~/.ssh/google_compute_engine

          gcloud compute os-login ssh-keys add \
            --key-file="$HOME/.ssh/google_compute_engine.pub" \
            --ttl=1h

      - name: Test VM connectivity
        env:
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_ZONE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$PROJECT_ID" \
            --tunnel-through-iap \
            --ssh-key-file="$HOME/.ssh/google_compute_engine" \
            --command="whoami && hostname && docker --version"